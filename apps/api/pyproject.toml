[project]
name = "reup-douyin-api"
version = "0.0.0"
description = "FastAPI HTTP boundary for reup-douyin."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2.0",
  "aiohttp>=3.9,<4.0",
  "cryptography>=42.0,<46.0",
  "fastapi>=0.115,<1.0",
  "google-auth>=2.35,<3.0",
  "google-genai>=1.30,<2.0",
  "playwright>=1.45,<2.0",
  "pydantic-settings>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "requests>=2.31,<3.0",
  "openai>=1.40,<2.0",
  "Pillow>=10.0,<12.0",
  "python-multipart>=0.0.9,<1.0",
  "numpy>=1.26,<3.0",
  "opencv-contrib-python-headless>=4.8,<5.0",
  "scipy>=1.11,<2.0",
  "onnxruntime-directml>=1.24,<2.0; platform_system == 'Windows'",
  "onnxruntime>=1.16,<2.0; platform_system != 'Windows'",
  "tqdm>=4.66,<5.0",
  "tenacity>=8.2,<10.0",
  "SQLAlchemy>=2.0,<3.0"
]

[tool.reup-douyin]
status = "database-foundation"
runtime = "fastapi"

[tool.pytest.ini_options]
# Keep standalone QA runners at apps/api/test_*.py executable by operators,
# but never collect them as unittest modules with the same basename as tests/.
testpaths = ["tests"]
